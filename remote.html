<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Pilot prezentacji</title>
<style>
:root{
  --bg:#0b1220; --panel:#131c2e; --line:#2a3757; --text:#e8edf7; --muted:#9aa7c2;
  --bl:#2f8cff; --efs:#2ecc71; --warn:#ff5d5d; --gold:#ffc65c;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
#top{display:flex;justify-content:space-between;align-items:center;font:600 15px var(--mono);color:var(--gold);padding-bottom:8px;border-bottom:1px solid var(--line)}
#dot{width:10px;height:10px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:6px}
#dot.ok{background:var(--efs)}
h1{font-size:22px;line-height:1.25;margin:12px 0 8px}
#notes{flex:1;overflow:auto;font-size:var(--fs,18px);line-height:1.5;-webkit-user-select:text;user-select:text;padding-right:4px}
#notes p{margin-bottom:10px}
#next{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding:8px 0}
#btns{display:flex;gap:12px;height:120px}
button{border:0;border-radius:18px;font:700 22px var(--sans);color:#fff;background:var(--panel);border:1px solid var(--line)}
button:active{filter:brightness(1.4)}
button:disabled{opacity:.35}
#prev{flex:1}
#fwd{flex:2.2;background:var(--bl);border-color:var(--bl);font-size:28px}
#tools{display:flex;gap:8px;margin-top:10px}
#tools button{flex:1;height:40px;font-size:14px;font-weight:600;border-radius:10px}
#join{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
#join input{font:600 30px var(--mono);text-align:center;letter-spacing:4px;text-transform:uppercase;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#join button{height:60px;background:var(--bl)}
#join p{color:var(--muted);font-size:15px}
.hidden{display:none!important}
</style>
</head>
<body>

<form id="join" class="hidden">
  <h1>Pilot prezentacji</h1>
  <p>Na komputerze wciśnij <b>R</b> i wpisz kod widoczny pod kodem QR.</p>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KOD">
  <button>Połącz</button>
</form>

<main id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="top"><span><span id="dot"></span><span id="pos">—</span></span><span id="plan"></span><span id="time">00:00</span></div>
  <h1 id="title">Łączenie…</h1>
  <div id="notes"></div>
  <div id="next"></div>
  <div id="btns"><button id="prev" disabled>◀</button><button id="fwd" disabled>Dalej ▶</button></div>
  <div id="tools"><button id="smaller">A−</button><button id="bigger">A+</button><button id="reset">⏱ od zera</button><button id="first">⏮ start</button></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let code = location.hash.slice(1).toUpperCase(), peer = null, conn = null, retry = null, base = null, total = 0;
  let fs = 18;

  function setOnline(ok) {
    $('dot').classList.toggle('ok', ok);
    $('prev').disabled = $('fwd').disabled = !ok;
    if (!ok && !base) $('title').textContent = 'Łączenie z prezentacją…';
  }
  function scheduleRetry() {
    setOnline(false);
    clearTimeout(retry);
    retry = setTimeout(connect, 2000);
  }

  function connect() {
    clearTimeout(retry);
    if (conn?.open) return;
    if (!peer || peer.destroyed) {
      peer = new Peer();
      peer.on('open', connect);
      peer.on('disconnected', () => setTimeout(() => !peer.destroyed && peer.reconnect(), 1000));
      // peer-unavailable = prezentacja jeszcze nie nasłuchuje (nie wciśnięto R)
      peer.on('error', scheduleRetry);
      return;
    }
    if (!peer.open) return;
    conn = peer.connect('bitlocker-efs-' + code, { reliable: true });
    conn.on('open', () => setOnline(true));
    conn.on('data', render);
    conn.on('close', scheduleRetry);
    conn.on('error', scheduleRetry);
  }

  function render(m) {
    if (m?.cmd !== 'state') return;
    total = m.total;
    $('pos').textContent = `${m.n + 1}/${m.total}`;
    $('plan').textContent = `plan ${m.time}`;
    $('title').textContent = m.title;
    $('notes').innerHTML = m.notes;
    $('notes').scrollTop = 0;
    $('next').textContent = 'Następny: ' + m.next;
    if (m.elapsed != null) base = Date.now() - m.elapsed;
  }
  const send = msg => conn?.open && conn.send(msg);

  $('fwd').onclick = () => send({ cmd: 'next' });
  $('prev').onclick = () => send({ cmd: 'prev' });
  $('first').onclick = () => send({ cmd: 'go', n: 0 });
  $('reset').onclick = () => send({ cmd: 'reset' });
  const font = d => { fs = Math.max(13, Math.min(30, fs + d)); document.documentElement.style.setProperty('--fs', fs + 'px'); };
  $('smaller').onclick = () => font(-2);
  $('bigger').onclick = () => font(2);

  setInterval(() => {
    if (!base) return;
    const s = Math.floor((Date.now() - base) / 1000);
    $('time').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);

  // ekran nie gaśnie w trakcie prezentacji (Safari 16.4+)
  let lock = null;
  const wake = async () => { try { lock = await navigator.wakeLock?.request('screen'); } catch {} };
  // iOS usypia połączenie, gdy Safari idzie w tło – po powrocie łączymy od nowa
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !code) return;
    wake();
    if (!conn?.open) connect();
  });

  function start() {
    $('join').classList.add('hidden');
    $('app').classList.remove('hidden');
    wake();
    connect();
  }
  $('join').onsubmit = e => {
    e.preventDefault();
    code = $('code').value.trim().toUpperCase();
    if (code.length !== 6) return;
    history.replaceState(null, '', '#' + code);
    start();
  };

  if (/^[A-Z0-9]{6}$/.test(code)) start();
  else $('join').classList.remove('hidden');
})();
</script>
</body>
</html>
